name: Build Darkmatter (Gloria) + KSU Next + SusFS + Xanmod

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Tên file defconfig'
        required: true
        default: 'android-x86_64_defconfig'

jobs:
  build-kernel:
    name: Compile bzImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # Quan trọng: Tải toàn bộ driver hãng thứ 3 của Darkmatter
          
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev curl wget gcc-multilib g++-multilib

      - name: Inject SukiSU-Ultra
        run: |
          echo "1. Dọn dẹp tàn dư KernelSU cũ của Darkmatter..."
          rm -rf drivers/kernelsu
          
          # Dùng sed để xóa các dòng code gọi thư mục kernelsu cũ ra khỏi Kconfig và Makefile
          sed -i '/drivers\/kernelsu/d' drivers/Kconfig
          sed -i '/drivers\/kernelsu/d' drivers/Makefile
          
          echo "2. Bơm SukiSU-Ultra vào Kernel tree sạch..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

      - name: Inject SusFS (Xóa dấu vết KSU)
        run: |
          echo "Bơm SusFS vào Kernel tree..."
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1
          
          # Patch các file VFS của kernel để giấu OverlayFS
          cp -rp susfs4ksu/kernel_patches/fs/* fs/
          cp -rp susfs4ksu/kernel_patches/include/linux/* include/linux/
          
          # Patch riêng cho KSU Next
          patch -p1 --forward < susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true

      - name: Configure Kernel (Sử dụng .config gốc 40MB)
        run: |
          echo "1. Kiểm tra sự tồn tại của file .config gốc..."
          ls -la .config
          
          echo "2. Bơm cờ KernelSU / SukiSU-Ultra vào cấu hình..."
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_MODULES
          
          # Cờ bắt buộc nếu bạn dùng SukiSU-Ultra
          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          
          echo "3. Chuẩn hóa và tự động điền các dependency còn thiếu..."
          make olddefconfig


      - name: Compile bzImage (Đốt CPU)
        run: |
          echo "Build Kernel..."
          make -j$(nproc) bzImage
          
          echo "Build Modules..."
          make -j$(nproc) modules
          
          echo "Gom Modules lại vào một thư mục..."
          make INSTALL_MOD_PATH=./output_modules modules_install
          
      - name: Upload Artifacts (bzImage + Modules)
        uses: actions/upload-artifact@v4
        with:
          name: Darkmatter-KSU-Complete
          path: |
            arch/x86/boot/bzImage
            output_modules/
          retention-days: 7
